[project]
name = "servidor-rag-sap"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "mcp<2",
    "sentence-transformers",
    "chromadb",
    "pip-system-certs>=5.3",
    "pypdf",
    "uvicorn",
    "starlette",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["server.py", "bd_config.py", "ingerir.py", "listar_libros.py", "query.py", "clean_core_catalog.json.gz", "titulos_libros_sap.json"]

[project.scripts]
servidor-rag-sap = "server:mcp.run"
